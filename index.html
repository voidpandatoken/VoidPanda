<!doctype html>
<html lang="en" class="h-full w-full scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoidPanda Ecosystem</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #050508;
            background-image: radial-gradient(circle at top, #0f0f1a, #050508 80%);
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            margin: 0;
        }

        #noise {
            position: fixed;
            inset: 0;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.05;
            z-index: 1;
            pointer-events: none;
        }

        .cursor-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(120, 120, 255, 0.15), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: transform 0.1s ease-out;
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .hero-img {
            filter: drop-shadow(0 0 30px rgba(120, 120, 255, 0.6)) drop-shadow(0 0 60px rgba(140, 120, 255, 0.4));
            animation: float 4s ease-in-out infinite;
        }

        .logo-glow {
            filter: drop-shadow(0 0 20px rgba(162, 92, 250, 0.7));
        }

        .btn-glow {
            display: inline-flex;
            background: linear-gradient(90deg, #885cfa, #a25cfa);
            box-shadow: 0 0 15px rgba(162, 92, 250, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(162, 92, 250, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        @keyframes customPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(162, 92, 250, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.2); transform: scale(1); }
