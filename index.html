<!doctype html>
<html lang="en" class="h-full w-full scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoidPanda Ecosystem</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #050508;
            background-image: radial-gradient(circle at top, #1a1a2e, #050508 70%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            margin: 0;
        }

        .void-video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        @media (max-width: 768px) {
            #desktop-video { display: none !important; }
            #mobile-video { display: block !important; }
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .hero-img {
            filter: drop-shadow(0 0 30px rgba(162, 92, 250, 0.5));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes flashWhitePurple {
            0%, 100% { color: #fff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.6); }
            50% { color: #a25cfa; text-shadow: 0 0 20px rgba(162, 92, 250, 0.8); }
        }
        .flashing-title {
            animation: flashWhitePurple 2.5s infinite ease-in-out;
            text-decoration: none;
        }

        .btn-pulse {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, #885cfa, #a25cfa);
            box-shadow: 0 0 15px rgba(162, 92, 250, 0.4);
            transition: all 0.3s ease;
        }

        .story-line { opacity: 0; position: absolute; text-shadow: 0 0 20px rgba(162, 92, 250, 0.6); width: 100%; text-align: center; }
        @keyframes storyFade { 0% { opacity: 0; transform: translateY(10px); } 10% { opacity: 1; transform: translateY(0); } 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-10px); } }
        .story-line.seq-1 { animation: storyFade 2400ms ease-in-out 0s forwards; }
        .story-line.seq-2 { animation: storyFade 2400ms ease-in-out 2400ms forwards; }
        .story-line.seq-3 { animation: storyFade 2400ms ease-in-out 4800ms forwards; }
        .story-line.seq-4 { animation: storyFade 2400ms ease-in-out 7200ms forwards; }
        .story-line.seq-5 { animation: storyFade 2400ms ease-in-out 9600ms forwards; }
    </style>
</head>
<body class="w-full h-full m-0" style="overflow: hidden;">

    <video autoplay muted loop playsinline class="void-video-bg" id="desktop-video">
        <source src="void-bg-desktop.mp4" type="video/mp4">
    </video>
    <video autoplay muted loop playsinline class="void-video-bg" id="mobile-video">
        <source src="void-bg-mobile.mp4" type="video/mp4">
    </video>

    <div id="storyPopup" class="fixed inset-0 z-[100] flex flex-col items-center justify-center text-center bg-[#050508] transition-opacity duration-700 px-4">
        <img src="https://i.imgur.com/x64Wv1U.png" alt="VoidPanda" class="w-64 md:w-80 mb-12 filter drop-shadow-[0_0_20px_rgba(162,92,250,0.5)]">
        <div class="relative h-24 w-full max-w-3xl flex items-center justify-center">
            <p class="story-line seq-1 text-lg md:text-3xl text-[#a25cfa] font-bold uppercase tracking-widest">The Void is the market — chaotic, emotional, and unforgiving.</p>
            <p class="story-line seq-2 text-lg md:text-3xl text-[#a25cfa] font-bold uppercase tracking-widest">Most get lost in it.</p>
            <p class="story-line seq-3 text-lg md:text-3xl text-[#a25cfa] font-bold uppercase tracking-widest">VoidPanda entered it.</p>
            <p class="story-line seq-4 text-lg md:text-3xl text-[#a25cfa] font-bold uppercase tracking-widest">Not to escape the chaos…</p>
            <p class="story-line seq-5 text-lg md:text-3xl text-[#a25cfa] font-bold uppercase tracking-widest">But to bring order to it.</p>
        </div>
        <button onclick="hideIntro()" class="mt-16 px-6 py-2 border border-white/20 rounded-full text-white/50 hover:text-white transition-all text-sm tracking-wider font-orbitron">Skip Intro</button>
    </div>

    <nav class="fixed top-0 w-full flex justify-center items-center p-4 bg-black/40 backdrop-blur-xl border-b border-white/5 z-50">
        <div id="navPandaContainer" class="absolute left-3 md:left-6 top-1/2 -translate-y-1/2 opacity-0 pointer-events-none transition-opacity duration-500 cursor-pointer" onclick="window.scrollTo(0,0)">
            <img src="https://i.imgur.com/x64Wv1U.png" alt="VoidPanda" class="w-7 md:w-10 h-7 md:h-10">
        </div>
        <div class="flex items-center gap-5 text-[10px] md:text-sm uppercase tracking-wide font-bold">
            <a href="index.html" class="text-white">Home</a>
            <a href="lore.html" class="text-gray-400 hover:text-white">Lore</a>
            <a href="writings.html" class="text-gray-400 hover:text-white">Writings</a>
            <a href="about.html" class="text-gray-400 hover:text-white">About</a>
            <a href="portal.html" class="text-gray-400 hover:text-white">Portal</a>
        </div>
    </nav>

    <main class="relative z-10 flex flex-col items-center w-full">
        
        <section id="home" class="text-center w-full flex flex-col items-center justify-start pt-24 px-6 min-h-screen">
            <a href="#auth-section" class="flashing-title font-bold text-sm md:text-xl uppercase tracking-[0.3em] mb-10 cursor-pointer block">Access Terminal</a>
            
            <div class="flex flex-col items-center w-full">
                <img src="https://i.imgur.com/x64Wv1U.png" alt="VoidPanda Head" class="hero-img w-full max-w-[180px] md:max-w-[280px] block">
                <img src="https://i.imgur.com/PqRqnD9.png" alt="VoidPanda Logo" class="w-full max-w-[140px] md:max-w-[220px] -mt-5 md:-mt-8 block filter drop-shadow-[0_0_15px_rgba(162,92,250,0.7)]">
            </div>

            <p class="text-gray-400 text-[10px] md:text-xs font-semibold uppercase tracking-[0.4em] mt-8 mb-10">Order in the Chaos.</p>
            <a href="thevoid.html" class="btn-pulse px-10 py-3 rounded-xl text-white font-bold tracking-widest uppercase border border-[#a25cfa] text-[10px] md:text-sm mb-20">Enter the Void</a>
        </section>

        <section id="auth-section" class="scroll-mt-24 w-full py-24 bg-[#08080c] flex flex-col items-center relative z-20 px-6">
            <div class="w-full max-w-md bg-[#0a0a12] p-10 rounded-3xl border border-[#a25cfa]/20 shadow-2xl">
                <h2 class="text-lg md:text-xl font-bold text-white mb-2 uppercase tracking-widest text-center">Terminal Access</h2>
                <p class="text-gray-500 text-[9px] text-center mb-8 uppercase tracking-[0.2em]">Authenticate your signal.</p>
                <div class="space-y-4">
                    <input type="email" id="email" placeholder="Enter Email" class="w-full bg-black/40 border border-white/5 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#a25cfa]/50 text-xs">
                    <input type="password" id="password" placeholder="Enter Password" class="w-full bg-black/40 border border-white/5 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#a25cfa]/50 text-xs">
                    <div class="flex gap-4 pt-2">
                        <button onclick="handleSignUp()" class="w-1/2 py-3 rounded-xl border border-white/5 text-gray-400 font-bold uppercase tracking-widest text-[9px] hover:bg-white/5 transition-all">Sign Up</button>
                        <button onclick="handleLogin()" class="w-1/2 btn-pulse py-3 rounded-xl text-white font-bold uppercase tracking-widest text-[9px]">Log In</button>
                    </div>
                </div>
                <p id="auth-msg" class="mt-4 text-[9px] text-center uppercase tracking-widest text-[#a25cfa]"></p>
            </div>
        </section>

    </main>

    <script>
        // INSERT YOUR SUPABASE KEYS HERE
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleSignUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('auth-msg');
            
            const { data, error } = await _supabase.auth.signUp({ email, password });
            if (error) msg.innerText = error.message;
            else msg.innerText = "Check your email for confirmation link.";
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('auth-msg');

            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) msg.innerText = error.message;
            else window.location.href = "portal.html"; // Redirect on success
        }

        function hideIntro() {
            const popup = document.getElementById('storyPopup');
            if (popup) {
                popup.style.opacity = '0';
                popup.style.pointerEvents = 'none'; 
                document.body.style.overflow = 'auto'; 
                setTimeout(() => popup.style.display = 'none', 700);
            }
        }
        setTimeout(hideIntro, 12000);

        window.addEventListener('scroll', () => {
            const navPanda = document.getElementById('navPandaContainer');
            if (window.scrollY > 200) {
                navPanda.classList.remove('opacity-0', 'pointer-events-none');
                navPanda.classList.add('opacity-100');
            } else {
                navPanda.classList.remove('opacity-100');
                navPanda.classList.add('opacity-0', 'pointer-events-none');
            }
        });

        window.addEventListener('touchstart', function() {
            document.querySelectorAll('video').forEach(v => {
                v.play().catch(() => {});
            });
        }, {once: true});
    </script>
</body>
</html>
