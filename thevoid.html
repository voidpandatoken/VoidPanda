<!doctype html>
<html lang="en" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Void</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #020203;
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
        }

        /* 1. The Canvas Starfield getting sucked in */
        #event-horizon {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 2. The Black Hole */
        .black-hole-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 15vw;
            height: 15vw;
            min-width: 150px;
            min-height: 150px;
            background-color: #000;
            border-radius: 50%;
            box-shadow: 
                0 0 60px 20px rgba(162, 92, 250, 0.8),
                0 0 120px 40px rgba(136, 92, 250, 0.5),
                0 0 200px 80px rgba(80, 40, 200, 0.3),
                inset 0 0 20px 5px rgba(0,0,0,1);
            z-index: 1;
            animation: pulseHole 3s infinite alternate ease-in-out;
        }

        @keyframes pulseHole {
            0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 60px 20px rgba(162, 92, 250, 0.8), 0 0 120px 40px rgba(136, 92, 250, 0.5); }
            100% { transform: translate(-50%, -50%) scale(1.02); box-shadow: 0 0 80px 25px rgba(162, 92, 250, 1), 0 0 150px 50px rgba(136, 92, 250, 0.6); }
        }

        /* 3. The Spaceship & Panda Struggle Container */
        .struggle-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            /* Positions the ship just outside the black hole on the right */
            transform: translate(8vw, -50%); 
            z-index: 10;
            width: 180px;
            height: 180px;
            animation: orbitalShake 0.4s infinite linear;
        }

        @media (max-width: 768px) {
            .struggle-zone {
                transform: translate(25vw, -50%);
                width: 120px;
                height: 120px;
            }
        }

        /* Violent shaking against the gravity */
        @keyframes orbitalShake {
            0% { margin-left: 0px; margin-top: 0px; }
            25% { margin-left: -2px; margin-top: 1px; }
            50% { margin-left: 1px; margin-top: -2px; }
            75% { margin-left: -1px; margin-top: -1px; }
            100% { margin-left: 0px; margin-top: 0px; }
        }

        /* The Spaceship SVG */
        .spaceship {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
            /* Angled as if being pulled left toward the center */
            transform: rotate(-15deg); 
        }

        /* The Panda Swinging out of the hull breach */
        .panda-tether {
            position: absolute;
            /* Anchored to the "hole" in the side of the ship */
            top: 45%;
            left: -10%;
            width: 60px;
            height: auto;
            transform-origin: top right;
            animation: violentSwing 1.5s infinite ease-in-out;
            filter: drop-shadow(0 0 15px rgba(162, 92, 250, 0.8));
        }

        @media (max-width: 768px) {
            .panda-tether { width: 45px; }
        }

        @keyframes violentSwing {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-35deg); }
            100% { transform: rotate(0deg); }
        }

        /* 4. The Single Action Button */
        .void-btn-container {
            position: absolute;
            bottom: 10vh;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 50;
        }

        .btn-glow {
            display: inline-flex;
            background: linear-gradient(90deg, #885cfa, #a25cfa);
            box-shadow: 0 0 25px rgba(162, 92, 250, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }
        
        .btn-glow:hover {
            box-shadow: 0 0 40px rgba(162, 92, 250, 1), inset 0 0 20px rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
        }

    </style>
</head>
<body>

    <canvas id="event-horizon"></canvas>

    <div class="black-hole-core"></div>

    <div class="struggle-zone">
        <svg class="spaceship" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M80 50 C80 30, 60 20, 50 20 C40 20, 20 30, 20 50 C20 70, 40 80, 50 80 C60 80, 80 70, 80 50 Z" fill="#2d3748"/>
            <path d="M50 20 L60 10 L70 20 Z" fill="#4a5568"/>
            <path d="M50 80 L60 90 L70 80 Z" fill="#4a5568"/>
            <rect x="70" y="45" width="20" height="10" fill="#a0aec0" rx="2"/>
            <circle cx="55" cy="50" r="8" fill="#a25cfa" opacity="0.6"/>
            <circle cx="25" cy="50" r="10" fill="#000" />
            <path d="M15 45 L25 40 L30 55 L20 60 Z" fill="#000"/>
        </svg>
        
        <img src="https://i.imgur.com/x64Wv1U.png" alt="Panda" class="panda-tether">
    </div>

    <div class="void-btn-container">
        <a href="https://www.google.com" class="btn-glow px-10 py-4 rounded-xl font-bold text-lg md:text-xl">Enter the Void</a>
    </div>

    <script>
        // Physics Engine for stars getting sucked into the center
        const canvas = document.getElementById('event-horizon');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        let stars = [];
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        for(let i = 0; i < 250; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                z: Math.random() * 2,
                size: Math.random() * 2.5
            });
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.z})`;
                ctx.fill();

                // Gravity pull math
                let dx = cx - star.x;
                let dy = cy - star.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                // The closer they get to the center, the faster they are sucked in
                let speed = 2 + (500 / Math.max(distance, 10)); 

                star.x += (dx / distance) * speed;
                star.y += (dy / distance) * speed;

                // If star hits the black hole, respawn it at the edge of the screen
                if (distance < 50) {
                    let angle = Math.random() * Math.PI * 2;
                    let spawnRadius = Math.max(canvas.width, canvas.height);
                    star.x = cx + Math.cos(angle) * spawnRadius;
                    star.y = cy + Math.sin(angle) * spawnRadius;
                }
            });
            requestAnimationFrame(animateStars);
        }
        animateStars();
    </script>
</body>
</html>
