<!doctype html>
<html lang="en" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Void</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000;
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
        }

        /* The Animated Video Background */
        #void-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            transform: translateX(-50%) translateY(-50%);
            object-fit: cover;
        }

        /* Overlay to keep the vibe dark and cinematic */
        .video-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.4) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .void-btn-container {
            position: absolute;
            bottom: 10vh;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 50;
        }

        .btn-glow {
            display: inline-flex;
            background: linear-gradient(90deg, #885cfa, #a25cfa);
            box-shadow: 0 0 25px rgba(162, 92, 250, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            padding: 1rem 2.5rem;
            border-radius: 0.75rem;
            font-weight: bold;
        }
        
        .btn-glow:hover {
            box-shadow: 0 0 40px rgba(162, 92, 250, 1), inset 0 0 20px rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="void-video">
        <source src="http://googleusercontent.com/generated_video_content/4513757863787041406" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="video-overlay"></div>

    <div class="void-btn-container">
        <a href="https://www.google.com" class="btn-glow text-lg md:text-xl">Enter the Void</a>
    </div>

</body>
</html>
