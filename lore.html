<!doctype html>
<html lang="en" class="h-full w-full scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoidPanda — Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    font-family: 'Orbitron', sans-serif;
    background: radial-gradient(circle at top, #0f0f1a, #050508);
    color: #fff;
    margin:0;
}

/* Tap targets */
a,button { min-height:44px; }

/* Cursor glow OFF on mobile (performance boost) */
.cursor-glow {
    position: fixed;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(120,120,255,0.15), transparent);
    border-radius:50%;
    pointer-events:none;
    transform:translate(-50%,-50%);
}
@media(max-width:768px){
    .cursor-glow{ display:none; }
}

/* Locked chapters */
.locked-chapter { opacity:0.35; }

/* Panda animation (kept) */
@keyframes bouncePulse {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-4px) scale(1.05); }
}
.nav-panda-anim {
    animation:bouncePulse 2.5s infinite;
}
.nav-panda-anim:hover {
    animation:none;
    transform:scale(1.1);
}

/* Buttons */
.btn-glow {
    background:linear-gradient(90deg,#885cfa,#a25cfa);
    transition:.3s;
}
.btn-glow:hover { transform:translateY(-2px); }

/* Story animations untouched (kept your cinematic work) */

</style>
</head>
