    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #050508;
            background-image: radial-gradient(circle at top, #0f0f1a, #050508 80%);
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            margin: 0;
        }

        .font-sans {
            font-family: 'Inter', sans-serif;
        }

        #noise {
            position: fixed;
            inset: 0;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.05;
            z-index: 1;
            pointer-events: none;
        }

        .cursor-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(120, 120, 255, 0.15), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: transform 0.1s ease-out;
        }

        .btn-glow {
            display: inline-flex;
            background: linear-gradient(90deg, #885cfa, #a25cfa);
            box-shadow: none;
            transition: all 0.3s ease;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
        }

        @keyframes bouncePulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.05); }
        }

        .nav-panda-anim {
            animation: bouncePulse 2.5s ease-in-out infinite;
            transition: transform 0.3s ease;
        }

        .nav-panda-anim:hover {
            animation: none; 
            transform: scale(1.1);
        }

        @keyframes blink { 50% { opacity: 0; } }
        .animate-blink { animation: blink 1s step-end infinite; }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #0a0a12 inset !important;
            -webkit-text-fill-color: white !important;
        }
    </style>
</head>
