<script>

/* ---------------- PARTICLES (optimized) ---------------- */
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');

function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
}
resize();
window.addEventListener('resize',resize);

const COUNT=innerWidth<768?40:80;
let particles=[];

for(let i=0;i<COUNT;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        speed:Math.random()+0.3,
        size:Math.random()*1.5
    });
}

let last=0;
function animate(t=0){
    if(t-last>33){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach(p=>{
            p.y+=p.speed;
            if(p.y>canvas.height){
                p.y=0;
                p.x=Math.random()*canvas.width;
            }
            ctx.fillRect(p.x,p.y,p.size,p.size);
        });
        last=t;
    }
    requestAnimationFrame(animate);
}
animate();

/* ---------------- CURSOR ---------------- */
if(innerWidth>768){
const glow=document.getElementById('cursorGlow');
window.addEventListener('mousemove',e=>{
    requestAnimationFrame(()=>{
        glow.style.left=e.clientX+'px';
        glow.style.top=e.clientY+'px';
    });
});
}

/* ---------------- EARLY ACCESS ---------------- */
function openEarlyAccess(){
    document.getElementById('earlyAccessModal').classList.remove('hidden');
}
function closeEarlyAccess(){
    document.getElementById('earlyAccessModal').classList.add('hidden');
}

/* ---------------- AUTH CHECK ---------------- */
let supabaseClient=null;

if(window.supabase){
    supabaseClient=window.supabase.createClient(
        'https://lhcvnxbsbxpeisseosap.supabase.co',
        'sb_publishable_NA2BPqJkDpBoEbaulYxHUw_kb2_tc4L'
    );
}

async function checkSession(){
    if(!supabaseClient) return;

    const {data:{session}}=await supabaseClient.auth.getSession();

    if(!session){
        // clean redirect (no flicker)
        window.location.replace("index.html");
    }
}
checkSession();

</script>
